controller:
  replicaCount: 1
  metrics:
    enabled: true
  prometheus:
    podMonitor:
      enabled: true
      namespace: monitoring
      labels:
        release: monitoring

lvmd:
  managed: true
  socketName: /run/topolvm/lvmd.sock
  deviceClasses:
    - name: k3s_topolvm
      volume-group: k3s_topolvm
      default: true
      spare-gb: 10

node:
  metrics:
    enabled: true
  prometheus:
    podMonitor:
      enabled: true
      namespace: monitoring   # 可选，指定 PodMonitor 放在哪个 ns
      labels:
        release: monitoring   # 匹配你 kube-prometheus-stack 的 selector

cert-manager:
  enabled: false

storageClasses:
  - name: topolvm-provisioner
    storageClass:
      fsType: ext4
      isDefaultClass: true
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
