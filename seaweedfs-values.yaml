image:
  tag: "4.46"

master:
  replicas: 1
  affinity: ""
  data:
    type: persistentVolumeClaim
    size: 1Gi
  metricsPort: 9327

volume:
  replicas: 1
  affinity: ""
  idx:
    type: persistentVolumeClaim
    size: "10Gi"
  dataDirs:
    - name: data
      type: persistentVolumeClaim
      size: 20Ti
      maxVolumes: 0
  metricsPort: 9327

filer:
  replicas: 1
  affinity: ""
  data:
    type: persistentVolumeClaim
    size: 10Gi
  metricsPort: 9327

s3:
  enabled: true
  replicas: 1
  affinity: ""
  enableAuth: true
  existingConfigSecret: seaweedfs-s3
  metricsPort: 9327

  createBuckets:
    - name: gitlab-artifacts
    - name: gitlab-lfs
    - name: gitlab-uploads
    - name: gitlab-packages
    - name: gitlab-backups
    - name: gitlab-backups-tmp
    - name: gitlab-runner-cache
    - name: gitlab-registry
