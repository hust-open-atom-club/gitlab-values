global:
  edition: ce
  time_zone: Asia/Shanghai

  hosts:
    domain: git.hust.edu.cn
    externalIP: REDACTED
    https: true
    ssh: git.hust.edu.cn

  shell:
    port: 32022

  gatewayApi:
    enabled: false
    configureCertmanager: false

  ingress:
    enabled: true
    provider: traefik
    class: traefik
    configureCertmanager: false
    annotations:
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    tls:
      enabled: true
      secretName: gitlab-cert-tls

  email:
    display_name: HUST Open Source GitLab
    from: noreply-git@openatom.club
    reply_to: noreply-git@openatom.club

  smtp:
    enabled: true
    address: smtp.feishu.cn
    authentication: login
    port: 465
    tls: true
    user_name: noreply-git@openatom.club
    password:
      secret: gitlab-smtp-password
      key: password


  psql:
    host: gitlab-db-rw.gitlab.svc.cluster.local
    port: 5432
    database: gitlabhq_production
    username: gitlab
    password:
      secret: gitlab-db-app
      key: password

  redis:
    host: valkey.gitlab.svc.cluster.local
    port: 6379
    database: 0
    auth:
      secret: gitlab-redis-password
      key: password

  appConfig:
    object_store:
      enabled: true
      proxy_download: true
      connection:
        secret: gitlab-object-storage
        key: connection

    artifacts:
      bucket: gitlab-artifacts

    lfs:
      bucket: gitlab-lfs

    uploads:
      bucket: gitlab-uploads

    packages:
      bucket: gitlab-packages

    backups:
      bucket: gitlab-backups
      tmpBucket: gitlab-backups-tmp
      objectStorage:
        backend: s3

  kas:
    enabled: false

  pages:
    enabled: false

  registry:
    enabled: true
    bucket: gitlab-registry

installCertmanager: false

nginx-ingress:
  enabled: false

traefik:
  install: false

gitlab:
  toolbox:
    backups:
      objectStorage:
        backend: s3
        config:
          secret: gitlab-backup-storage
          key: config

  gitaly:
    persistence:
      size: 40Ti

registry:
  enabled: true
  storage:
    secret: gitlab-registry-storage
    key: config

gitlab-runner:
  enabled: true
  runners:
    config: |
      [[runners]]
        [runners.kubernetes]
        image = "ubuntu:26.04"