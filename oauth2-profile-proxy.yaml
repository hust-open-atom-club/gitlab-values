# ------------------------------------------------------------------
# OAuth2 profile 中间层代理 —— 部署到 gitlab 命名空间
#
# 组成：
#   1. ConfigMap   oauth2-profile-proxy-script  挂载 python 脚本本身
#   2. Deployment  oauth2-profile-proxy          用 python:3-alpine 直接跑脚本
#   3. Service     oauth2-profile-proxy          ClusterIP:8000，暴露给集群内部
#   4. IngressRoute oauth2-profile-proxy         让 Traefik 把
#      https://git.hust.edu.cn/users/auth/oauth2_generic/profile 和
#      https://git.hust.edu.cn/users/auth/oauth2_generic/accessToken
#      都转发到这个 Service，而不是转发给 GitLab webservice
#
# profile 接口 token 传递方式：
#   GitLab webservice（omniauth-oauth2-generic + oauth2 gem）默认会把
#   access token 放在 Authorization: Bearer <token> 请求头里发起请求，
#   但这个上游（pass.hust.edu.cn CAS）只认 query string 里的
#   access_token 参数。本脚本会统一提取 token（不管它来自 Authorization
#   头还是 query string），再以 query 参数的形式转发给上游，不再转发
#   原始 Authorization 头。
#
# accessToken 接口 client 认证传递方式：
#   GitLab（oauth2 gem 默认的 basic_auth 模式）把 client_id/client_secret
#   放在 Authorization: Basic <base64> 请求头里，但上游只认 POST form
#   body 里的 client_id/client_secret 字段。本脚本会解出 Authorization
#   头里的凭证，合并进表单 body 再转发，并把上游原始响应透传回 GitLab。
#
# 部署前必须确认的事：
#   - ConfigMap 里的 UPSTREAM_URL 目前是 https://pass.hust.edu.cn/cas/oauth2.0/profile，
#     ACCESS_TOKEN_UPSTREAM_URL 目前是 https://pass.hust.edu.cn/cas/oauth2.0/accessToken，
#     确认这两个都是最终地址
#   - EMAIL_DOMAIN 目前是 @hust.edu.cn，确认这是你要用的邮箱域名
#   - 之后在 GitLab 的 oauth2_generic provider 配置里，把
#     user_info_url 指向 https://git.hust.edu.cn/users/auth/oauth2_generic/profile，
#     token_url 指向 https://git.hust.edu.cn/users/auth/oauth2_generic/accessToken
#     （GitLab webservice 是直接对外发起这两条 HTTP 请求，会走公网 DNS
#     解析回你们自己的 Traefik，再被下面的 IngressRoute 拦截转发到这个
#     代理 Service，不会影响 /users/auth/oauth2_generic/callback 这条
#     登录回调路径，那条路径仍然正常交给 GitLab webservice 处理）
# ------------------------------------------------------------------

apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-profile-proxy-script
  namespace: gitlab
data:
  oauth2_proxy.py: |
    #!/usr/bin/env python3
    """
    OAuth2 中间层代理脚本。

    监听本机 8000 端口，提供两个接口：

    1. profile 接口：接收对 PROXY_PATH 的请求，转发到上游 profile 接口，
       并在返回的 JSON 中根据 id 字段补充一个 email 字段
       （id + EMAIL_DOMAIN），最后把结果返回给调用方。
    2. accessToken 接口：接收对 ACCESS_TOKEN_PATH 的请求，转发到上游
       accessToken 换取接口，原样透传响应。

    调用方（GitLab webservice）传 access token 的方式可能是
    Authorization: Bearer <token> 请求头，也可能是 query string 里的
    access_token 参数。但这个上游只认 query string 里的 access_token，
    不认 Authorization 头，所以本脚本会统一提取 token（不管它来自请求
    头还是 query），再以 query 参数的形式转发给上游。

    另外还监听 accessToken 换取接口：GitLab（oauth2 gem 默认的
    basic_auth 模式）会把 client_id/client_secret 放在
    Authorization: Basic <base64(client_id:client_secret)> 请求头里，
    但对接的鉴权服务器只认 POST form body 里的 client_id/client_secret
    字段。本脚本会从 Authorization 头解出这两个值，合并进原始表单
    body（grant_type/code/redirect_uri 等字段不变），再转发给上游，
    并把上游的原始响应（状态码、Content-Type、body）直接透传给 GitLab。

    仅使用标准库实现，无需额外安装依赖。
    """

    from __future__ import annotations

    import base64
    import gzip
    import json
    import logging
    import zlib
    from http import HTTPStatus
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.error import HTTPError, URLError
    from urllib.parse import parse_qs, parse_qsl, urlencode
    from urllib.request import Request, urlopen

    LISTEN_PORT = 8000
    PROXY_PATH = "/profile"
    ACCESS_TOKEN_PATH = "/accessToken"
    HEALTHZ_PATH = "/healthz"
    UPSTREAM_URL = "https://pass.hust.edu.cn/cas/oauth2.0/profile"
    ACCESS_TOKEN_UPSTREAM_URL = "https://pass.hust.edu.cn/cas/oauth2.0/accessToken"
    ACCESS_TOKEN_PARAM = "access_token"
    EMAIL_DOMAIN = "@hust.edu.cn"
    UPSTREAM_TIMEOUT_SECONDS = 10

    logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
    logger = logging.getLogger("oauth2_proxy")


    class ProfileProxyHandler(BaseHTTPRequestHandler):
        """处理 /api/profile 请求并转发到上游 OAuth2 服务。"""

        def do_GET(self) -> None:
            self._handle_request("GET")

        def do_POST(self) -> None:
            self._handle_request("POST")

        def _handle_request(self, method: str) -> None:
            request_path, _, query_string = self.path.partition("?")

            if request_path == HEALTHZ_PATH:
                # 探针专用端点，不转发上游、不需要 token，只用来确认进程本身活着。
                self._send_json(HTTPStatus.OK, {"status": "ok"})
                return

            body = None
            content_length = self.headers.get("Content-Length")
            if content_length:
                body = self.rfile.read(int(content_length))

            if request_path == ACCESS_TOKEN_PATH:
                self._handle_access_token_request(body)
                return

            if request_path != PROXY_PATH:
                self._send_json(HTTPStatus.NOT_FOUND, {"error": "not found"})
                return

            access_token = self._extract_access_token(query_string)
            if not access_token:
                logger.warning("请求中未找到 access token（既不在 Authorization 头，也不在 query string 里）")
                self._send_json(HTTPStatus.UNAUTHORIZED, {"error": "missing access token"})
                return

            try:
                upstream_json = self._forward_to_upstream(method, access_token, body)
            except HTTPError as exc:
                logger.warning("上游返回错误状态码: %s", exc.code)
                self._send_json(exc.code, {"error": f"upstream error: {exc.code}"})
                return
            except URLError as exc:
                logger.error("请求上游失败: %s", exc)
                self._send_json(HTTPStatus.BAD_GATEWAY, {"error": "failed to reach upstream"})
                return
            except json.JSONDecodeError:
                logger.error("上游返回内容不是合法 JSON")
                self._send_json(HTTPStatus.BAD_GATEWAY, {"error": "upstream returned invalid json"})
                return

            profile_id = upstream_json.get("id")
            if profile_id is None:
                logger.warning("上游 JSON 缺少 id 字段: %s", upstream_json)
                self._send_json(HTTPStatus.BAD_GATEWAY, {"error": "upstream response missing 'id' field"})
                return

            upstream_json["email"] = f"{profile_id}{EMAIL_DOMAIN}"
            self._send_json(HTTPStatus.OK, upstream_json)

        def _extract_access_token(self, query_string: str) -> str | None:
            """从 Authorization 头或 query string 里取出 access token，前者优先。"""
            auth_header = self.headers.get("Authorization", "")
            if auth_header.lower().startswith("bearer "):
                token = auth_header[len("Bearer "):].strip()
                if token:
                    return token

            if query_string:
                params = parse_qs(query_string)
                values = params.get(ACCESS_TOKEN_PARAM)
                if values:
                    return values[0]

            return None

        def _forward_to_upstream(self, method: str, access_token: str, body: bytes | None) -> dict:
            # 上游只认 query string 里的 access_token，所以统一以这种方式转发，
            # 不再转发 Authorization 头（上游不识别）。
            upstream_url = f"{UPSTREAM_URL}?{urlencode({ACCESS_TOKEN_PARAM: access_token})}"

            forward_headers = self._build_forward_headers(extra_exclude=("authorization",))

            request = Request(upstream_url, data=body, headers=forward_headers, method=method)
            with urlopen(request, timeout=UPSTREAM_TIMEOUT_SECONDS) as response:
                raw = self._decompress_body(response.read(), response.getheader("Content-Encoding"))
            return json.loads(raw)

        def _handle_access_token_request(self, body: bytes | None) -> None:
            """
            将 GitLab 发来的 accessToken 换取请求转发给上游鉴权服务器。

            GitLab（oauth2 gem 的 basic_auth 模式）把 client_id/client_secret
            放在 Authorization: Basic 请求头里；上游只认 POST form body 里的
            client_id/client_secret 字段。这里把两者合并后再转发，并把上游
            的原始响应状态码/Content-Type/body 直接透传回 GitLab。
            """
            credentials = self._extract_basic_auth_credentials()
            if credentials is None:
                logger.warning("accessToken 请求缺少合法的 Authorization: Basic 头")
                self._send_json(HTTPStatus.UNAUTHORIZED, {"error": "missing or invalid client credentials"})
                return
            client_id, client_secret = credentials

            form_fields = parse_qsl((body or b"").decode("utf-8"), keep_blank_values=True)
            form_fields = [(k, v) for k, v in form_fields if k not in ("client_id", "client_secret")]
            form_fields.append(("client_id", client_id))
            form_fields.append(("client_secret", client_secret))
            new_body = urlencode(form_fields).encode("utf-8")

            forward_headers = self._build_forward_headers(extra_exclude=("authorization",))
            forward_headers["Content-Type"] = "application/x-www-form-urlencoded"
            forward_headers["Content-Length"] = str(len(new_body))

            request = Request(
                ACCESS_TOKEN_UPSTREAM_URL, data=new_body, headers=forward_headers, method="POST"
            )
            try:
                with urlopen(request, timeout=UPSTREAM_TIMEOUT_SECONDS) as response:
                    raw = self._decompress_body(response.read(), response.getheader("Content-Encoding"))
                    self._send_raw(response.status, response.getheader("Content-Type"), raw)
            except HTTPError as exc:
                logger.warning("accessToken 上游返回错误状态码: %s", exc.code)
                raw = self._decompress_body(exc.read(), exc.headers.get("Content-Encoding"))
                self._send_raw(exc.code, exc.headers.get("Content-Type"), raw)
            except URLError as exc:
                logger.error("请求 accessToken 上游失败: %s", exc)
                self._send_json(HTTPStatus.BAD_GATEWAY, {"error": "failed to reach upstream"})

        def _extract_basic_auth_credentials(self) -> tuple[str, str] | None:
            """从 Authorization: Basic 头解出 (client_id, client_secret)。"""
            auth_header = self.headers.get("Authorization", "")
            if not auth_header.lower().startswith("basic "):
                return None
            encoded = auth_header[len("Basic "):].strip()
            try:
                decoded = base64.b64decode(encoded).decode("utf-8")
            except (ValueError, UnicodeDecodeError):
                return None
            if ":" not in decoded:
                return None
            client_id, _, client_secret = decoded.partition(":")
            if not client_id or not client_secret:
                return None
            return client_id, client_secret

        def _build_forward_headers(self, extra_exclude: tuple[str, ...] = ()) -> dict:
            """
            构造转发给上游的请求头。

            始终去掉 Accept-Encoding：如果原样转发调用方（GitLab）的
            Accept-Encoding: gzip，上游会返回 gzip 压缩的响应体，而这个
            标准库实现不会自动解压，会导致后续 JSON 解析/透传拿到一堆
            压缩后的二进制（表现为 GitLab 日志里的
            "invalid symbol in encoding UTF-8" / gzip 魔数 \\x1f\\x8b）。
            不请求压缩最省事：上游会用未压缩的方式返回。
            """
            excluded = {"host", "content-length", "accept-encoding", *extra_exclude}
            return {
                key: value
                for key, value in self.headers.items()
                if key.lower() not in excluded
            }

        @staticmethod
        def _decompress_body(data: bytes, content_encoding: str | None) -> bytes:
            """
            防御性解压：即便已经不请求压缩，万一上游仍然返回了压缩内容
            （忽略 Accept-Encoding 或本身固定返回压缩格式），也能正确处理。
            """
            encoding = (content_encoding or "").strip().lower()
            if encoding == "gzip":
                return gzip.decompress(data)
            if encoding == "deflate":
                return zlib.decompress(data)
            return data

        def _send_raw(self, status: int, content_type: str | None, data: bytes) -> None:
            """原样透传上游响应（用于 accessToken 换取接口，不做 JSON 解析或改写）。"""
            self.send_response(status)
            self.send_header("Content-Type", content_type or "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def _send_json(self, status: HTTPStatus, payload: dict) -> None:
            data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json; charset=utf-8")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def log_message(self, format: str, *args) -> None:  # noqa: A002
            logger.info("%s - %s", self.address_string(), format % args)


    def main() -> None:
        server = ThreadingHTTPServer(("0.0.0.0", LISTEN_PORT), ProfileProxyHandler)
        logger.info(
            "代理服务已启动，监听端口 %d；%s -> %s（token 转发到 query string）；%s -> %s（client 认证转发到 form body）",
            LISTEN_PORT,
            PROXY_PATH,
            UPSTREAM_URL,
            ACCESS_TOKEN_PATH,
            ACCESS_TOKEN_UPSTREAM_URL,
        )
        try:
            server.serve_forever()
        except KeyboardInterrupt:
            logger.info("收到中断信号，正在关闭服务")
        finally:
            server.server_close()


    if __name__ == "__main__":
        main()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-profile-proxy
  namespace: gitlab
  labels:
    app: oauth2-profile-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-profile-proxy
  template:
    metadata:
      labels:
        app: oauth2-profile-proxy
    spec:
      containers:
        - name: oauth2-profile-proxy
          image: python:3-alpine
          command: ["python3", "/app/oauth2_proxy.py"]
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
      volumes:
        - name: script
          configMap:
            name: oauth2-profile-proxy-script

---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-profile-proxy
  namespace: gitlab
  labels:
    app: oauth2-profile-proxy
spec:
  selector:
    app: oauth2-profile-proxy
  ports:
    - name: http
      port: 8000
      targetPort: 8000