# ------------------------------------------------------------------
# OAuth2 profile 中间层代理 —— 部署到 gitlab 命名空间
#
# 组成：
#   1. ConfigMap   oauth2-profile-proxy-script  挂载 python 脚本本身
#   2. Deployment  oauth2-profile-proxy          用 python:3-alpine 直接跑脚本
#   3. Service     oauth2-profile-proxy          ClusterIP:8000，暴露给集群内部
#   4. IngressRoute oauth2-profile-proxy         让 Traefik 把
#      https://git.hust.edu.cn/users/auth/oauth2_generic/profile 转发到
#      这个 Service，而不是转发给 GitLab webservice
#
# token 传递方式：
#   GitLab webservice（omniauth-oauth2-generic + oauth2 gem）默认会把
#   access token 放在 Authorization: Bearer <token> 请求头里发起请求，
#   但这个上游（pass.hust.edu.cn CAS）只认 query string 里的
#   access_token 参数。本脚本会统一提取 token（不管它来自 Authorization
#   头还是 query string），再以 query 参数的形式转发给上游，不再转发
#   原始 Authorization 头。
#
# 部署前必须确认的事：
#   - ConfigMap 里的 UPSTREAM_URL 目前是 https://pass.hust.edu.cn/cas/oauth2.0/profile，
#     确认这就是最终地址
#   - EMAIL_DOMAIN 目前是 @hust.edu.cn，确认这是你要用的邮箱域名
#   - 之后在 GitLab 的 oauth2_generic provider 配置里，把
#     user_info_url 指向 https://git.hust.edu.cn/users/auth/oauth2_generic/profile
#     （GitLab webservice 是直接对外发起这条 HTTP 请求，会走公网 DNS
#     解析回你们自己的 Traefik，再被下面的 IngressRoute 拦截转发到这个
#     代理 Service，不会影响 /users/auth/oauth2_generic/callback 这条
#     登录回调路径，那条路径仍然正常交给 GitLab webservice 处理）
# ------------------------------------------------------------------

apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-profile-proxy-script
  namespace: gitlab
data:
  oauth2_proxy.py: |
    #!/usr/bin/env python3
    """
    OAuth2 中间层代理脚本。

    监听本机 8000 端口，接收对 /api/profile 的请求，转发到
    上游 profile 接口，并在返回的 JSON 中根据 id 字段补充一个
    email 字段（id + EMAIL_DOMAIN），最后把结果返回给调用方。

    调用方（GitLab webservice）传 access token 的方式可能是
    Authorization: Bearer <token> 请求头，也可能是 query string 里的
    access_token 参数。但这个上游只认 query string 里的 access_token，
    不认 Authorization 头，所以本脚本会统一提取 token（不管它来自请求
    头还是 query），再以 query 参数的形式转发给上游。

    仅使用标准库实现，无需额外安装依赖。
    """

    from __future__ import annotations

    import json
    import logging
    from http import HTTPStatus
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.error import HTTPError, URLError
    from urllib.parse import parse_qs, urlencode
    from urllib.request import Request, urlopen

    LISTEN_PORT = 8000
    PROXY_PATH = "/users/auth/oauth2_generic/profile"
    HEALTHZ_PATH = "/healthz"
    UPSTREAM_URL = "https://pass.hust.edu.cn/cas/oauth2.0/profile"
    ACCESS_TOKEN_PARAM = "access_token"
    EMAIL_DOMAIN = "@hust.edu.cn"
    UPSTREAM_TIMEOUT_SECONDS = 10

    logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
    logger = logging.getLogger("oauth2_proxy")


    class ProfileProxyHandler(BaseHTTPRequestHandler):
        """处理 /api/profile 请求并转发到上游 OAuth2 服务。"""

        def do_GET(self) -> None:
            self._handle_request("GET")

        def do_POST(self) -> None:
            self._handle_request("POST")

        def _handle_request(self, method: str) -> None:
            request_path, _, query_string = self.path.partition("?")

            if request_path == HEALTHZ_PATH:
                # 探针专用端点，不转发上游、不需要 token，只用来确认进程本身活着。
                self._send_json(HTTPStatus.OK, {"status": "ok"})
                return

            if request_path != PROXY_PATH:
                self._send_json(HTTPStatus.NOT_FOUND, {"error": "not found"})
                return

            body = None
            content_length = self.headers.get("Content-Length")
            if content_length:
                body = self.rfile.read(int(content_length))

            access_token = self._extract_access_token(query_string)
            if not access_token:
                logger.warning("请求中未找到 access token（既不在 Authorization 头，也不在 query string 里）")
                self._send_json(HTTPStatus.UNAUTHORIZED, {"error": "missing access token"})
                return

            try:
                upstream_json = self._forward_to_upstream(method, access_token, body)
            except HTTPError as exc:
                logger.warning("上游返回错误状态码: %s", exc.code)
                self._send_json(exc.code, {"error": f"upstream error: {exc.code}"})
                return
            except URLError as exc:
                logger.error("请求上游失败: %s", exc)
                self._send_json(HTTPStatus.BAD_GATEWAY, {"error": "failed to reach upstream"})
                return
            except json.JSONDecodeError:
                logger.error("上游返回内容不是合法 JSON")
                self._send_json(HTTPStatus.BAD_GATEWAY, {"error": "upstream returned invalid json"})
                return

            profile_id = upstream_json.get("id")
            if profile_id is None:
                logger.warning("上游 JSON 缺少 id 字段: %s", upstream_json)
                self._send_json(HTTPStatus.BAD_GATEWAY, {"error": "upstream response missing 'id' field"})
                return

            upstream_json["email"] = f"{profile_id}{EMAIL_DOMAIN}"
            self._send_json(HTTPStatus.OK, upstream_json)

        def _extract_access_token(self, query_string: str) -> str | None:
            """从 Authorization 头或 query string 里取出 access token，前者优先。"""
            auth_header = self.headers.get("Authorization", "")
            if auth_header.lower().startswith("bearer "):
                token = auth_header[len("Bearer "):].strip()
                if token:
                    return token

            if query_string:
                params = parse_qs(query_string)
                values = params.get(ACCESS_TOKEN_PARAM)
                if values:
                    return values[0]

            return None

        def _forward_to_upstream(self, method: str, access_token: str, body: bytes | None) -> dict:
            # 上游只认 query string 里的 access_token，所以统一以这种方式转发，
            # 不再转发 Authorization 头（上游不识别）。
            upstream_url = f"{UPSTREAM_URL}?{urlencode({ACCESS_TOKEN_PARAM: access_token})}"

            forward_headers = {
                key: value
                for key, value in self.headers.items()
                if key.lower() not in ("host", "content-length", "authorization")
            }

            request = Request(upstream_url, data=body, headers=forward_headers, method=method)
            with urlopen(request, timeout=UPSTREAM_TIMEOUT_SECONDS) as response:
                raw = response.read()
            return json.loads(raw)

        def _send_json(self, status: HTTPStatus, payload: dict) -> None:
            data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json; charset=utf-8")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def log_message(self, format: str, *args) -> None:  # noqa: A002
            logger.info("%s - %s", self.address_string(), format % args)


    def main() -> None:
        server = ThreadingHTTPServer(("0.0.0.0", LISTEN_PORT), ProfileProxyHandler)
        logger.info(
            "代理服务已启动，监听端口 %d，转发 %s -> %s（access token 统一转发到上游 query string 中）",
            LISTEN_PORT,
            PROXY_PATH,
            UPSTREAM_URL,
        )
        try:
            server.serve_forever()
        except KeyboardInterrupt:
            logger.info("收到中断信号，正在关闭服务")
        finally:
            server.server_close()


    if __name__ == "__main__":
        main()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-profile-proxy
  namespace: gitlab
  labels:
    app: oauth2-profile-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-profile-proxy
  template:
    metadata:
      labels:
        app: oauth2-profile-proxy
    spec:
      containers:
        - name: oauth2-profile-proxy
          image: python:3-alpine
          command: ["python3", "/app/oauth2_proxy.py"]
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
      volumes:
        - name: script
          configMap:
            name: oauth2-profile-proxy-script

---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-profile-proxy
  namespace: gitlab
  labels:
    app: oauth2-profile-proxy
spec:
  selector:
    app: oauth2-profile-proxy
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---
# 用 Traefik 的 IngressRoute CRD 拦截 /api/profile，转发到上面的 Service。
# priority 设得比 GitLab chart 自动生成的 Ingress 更高，确保这条路径优先匹配，
# 不会被 GitLab webservice 的默认路由（PathPrefix `/`）抢先接管。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: oauth2-profile-proxy
  namespace: gitlab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`git.hust.edu.cn`) && PathPrefix(`/users/auth/oauth2_generic/profile`)
      kind: Rule
      priority: 100
      services:
        - name: oauth2-profile-proxy
          port: 8000
  tls:
    secretName: gitlab-cert-tls
