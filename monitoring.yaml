---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gitlab-db-metrics
  namespace: gitlab          # 建议放在 Cluster 所在的 gitlab namespace
  labels:
    release: monitoring      # 匹配 kube-prometheus-stack 的 podMonitorSelector
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: gitlab-db   # 关键：必须用这个 label 匹配 Cluster
  podMetricsEndpoints:
    - port: metrics           # CNPG 固定用名为 "metrics" 的端口，对应 9187
      interval: 30s
