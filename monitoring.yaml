---
# ---------- GitLab: registry ----------
# !! 当前 gitlab-registry Service 只有 http-registry(5000) 端口 !!
# !! 说明 registry metrics 尚未开启，需先在 values.yaml 加: !!
#   registry:
#     metrics:
#       enabled: true
# 开启后 Service 会新增一个 metrics 端口(通常是 5001)，
# 再取消下面注释并确认端口名后使用
#
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitlab-registry
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - gitlab
  selector:
    matchLabels:
      app: registry
      release: gitlab
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
---
# ---------- Valkey ----------
# Service: valkey-metrics, metrics 端口名: metrics (9121)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: valkey-metrics
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - gitlab
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/component: metrics
      app.kubernetes.io/instance: valkey
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s

