# ============================================================
# namespace 对照：
#   gitlab / valkey / cnpg  -> namespace: gitlab
#   seaweedfs               -> namespace: storage
# kube-prometheus-stack release 假设为 "monitoring"
#   (Prometheus CR selector label: release: monitoring)
# 所有 port 字段均已根据实际 kubectl get svc 输出核实
# ============================================================

---
# ---------- GitLab: webservice ----------
# Service: gitlab-webservice-default, metrics 端口名: http-metrics-ws (8083)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitlab-webservice
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - gitlab
  selector:
    matchLabels:
      app: webservice
      release: gitlab
  endpoints:
    - port: http-metrics-ws
      path: /metrics
      interval: 30s

