apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitlab-webservice
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - gitlab
  selector:
    matchLabels:
      app: webservice
  endpoints:
    - port: http-workhorse
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-cluster-metrics
  namespace: gitlab
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: gitlab-db
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
